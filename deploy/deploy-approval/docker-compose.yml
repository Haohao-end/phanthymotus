services:
  deploy-approval:
    build:
      context: ../..
      dockerfile: agents/deploy_approval/Dockerfile
    image: phanthy-motus/deploy-approval:local
    container_name: deploy-approval
    # ── Single-replica / single-serial-worker topology ───────────────
    # Exactly one replica of the Deploy Controller is expected. The controller
    # uses exactly one serial command worker. No distributed lock, no CAS, no
    # asyncio.gather for mutating deploy commands. Scaling replicas >1 would
    # violate the at-most-once execution model.
    restart: unless-stopped
    env_file:
      - ${DA_ENV_FILE:-/dev/null}
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "25001"
      GITHUB_COMMAND_POLL_INTERVAL_SECONDS: "60"
      REVIEW_AGENT_BASE_URL: "${REVIEW_AGENT_BASE_URL:-http://host.docker.internal:25000}"
      MACHINE_OWNERS_FILE: "/run/deploy-approval/machines.yaml"
      ALLOW_PRIVATE_HTTP: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${MACHINE_OWNERS_HOST_FILE:?MACHINE_OWNERS_HOST_FILE is required}:/run/deploy-approval/machines.yaml:ro
    # No DB volume — state is GitHub-only.
    ports:
      - "25001:25001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:25001/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
