<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1400 2500" width="1400" height="2500" role="img"
     aria-label="Deploy Approval GitHub-driven sequence diagram"
     xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#6B7A8D"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#C4673A"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#5C7A6A"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#A55E5E"/>
    </marker>
    <style>
      .mono { font-family: JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace; }
      .actor { rx:10; stroke-width:2; }
      .title { font-size:14px; font-weight:600; letter-spacing:.05em; }
      .small { font-size:10px; fill:#78716C; }
      .msg { font-size:10px; fill:#4F5C6B; }
      .msgStrong { font-size:10px; font-weight:600; fill:#4F5C6B; }
      .lifeline { stroke:#D6D3D1; stroke-width:1.5; stroke-dasharray:5 5; }
      .blue { stroke:#6B7A8D; fill:none; stroke-width:2; marker-end:url(#arrow-blue); }
      .orange { stroke:#C4673A; fill:none; stroke-width:2; marker-end:url(#arrow-orange); }
      .green { stroke:#5C7A6A; fill:none; stroke-width:2; marker-end:url(#arrow-green); }
      .red { stroke:#A55E5E; fill:none; stroke-width:2; marker-end:url(#arrow-red); }
      .statusWait { fill:#FBF4E8; stroke:#B07A3C; stroke-width:1.4; rx:5; }
      .statusRun { fill:#EFF1F5; stroke:#6B7A8D; stroke-width:1.4; rx:5; }
      .statusOk { fill:#EEF4F1; stroke:#5C7A6A; stroke-width:1.4; rx:5; }
      .statusFail { fill:#FBF1EC; stroke:#A55E5E; stroke-width:1.4; rx:5; }
      .statusText { font-size:10px; font-weight:600; }
      .gate { fill:#FAFAF9; stroke:#B07A3C; stroke-width:1.5; rx:8; }
    </style>
  </defs>

  <text x="40" y="42" class="mono title" fill="#425A4B">DEPLOY APPROVAL · GITHUB-DRIVEN SEQUENCE</text>

  <!-- Actors: names only, no subtitles -->
  <g class="mono">
    <rect x="40" y="72" width="150" height="48" class="actor" fill="#EEF4F1" stroke="#5C7A6A"/>
    <text x="115" y="102" text-anchor="middle" class="title" fill="#425A4B">Developer</text>

    <rect x="225" y="72" width="165" height="48" class="actor" fill="#EFF1F5" stroke="#6B7A8D"/>
    <text x="307" y="102" text-anchor="middle" class="title" fill="#4F5C6B">GitHub PR</text>

    <rect x="425" y="72" width="160" height="48" class="actor" fill="#EFF1F5" stroke="#6B7A8D"/>
    <text x="505" y="102" text-anchor="middle" class="title" fill="#4F5C6B">Review Agent</text>

    <rect x="620" y="72" width="185" height="48" class="actor" fill="#FBF1EC" stroke="#C4673A"/>
    <text x="712" y="102" text-anchor="middle" class="title" fill="#9A4F2F">Deploy Controller</text>

    <rect x="840" y="72" width="160" height="48" class="actor" fill="#EEF4F1" stroke="#5C7A6A"/>
    <text x="920" y="102" text-anchor="middle" class="title" fill="#425A4B">Machine Owner</text>

    <rect x="1035" y="72" width="160" height="48" class="actor" fill="#FBF1EC" stroke="#C4673A"/>
    <text x="1115" y="102" text-anchor="middle" class="title" fill="#9A4F2F">Agent Core</text>

    <rect x="1230" y="72" width="130" height="48" class="actor" fill="#EFF1F5" stroke="#6B7A8D"/>
    <text x="1295" y="102" text-anchor="middle" class="title" fill="#4F5C6B">COS</text>
  </g>

  <!-- Lifelines -->
  <g>
    <line x1="115" y1="120" x2="115" y2="2390" class="lifeline"/>
    <line x1="307" y1="120" x2="307" y2="2390" class="lifeline"/>
    <line x1="505" y1="120" x2="505" y2="2390" class="lifeline"/>
    <line x1="712" y1="120" x2="712" y2="2390" class="lifeline"/>
    <line x1="920" y1="120" x2="920" y2="2390" class="lifeline"/>
    <line x1="1115" y1="120" x2="1115" y2="2390" class="lifeline"/>
    <line x1="1295" y1="120" x2="1295" y2="2390" class="lifeline"/>
  </g>

  <!-- 01 REVIEW -->
  <text x="40" y="158" class="mono small">01 · REVIEW CURRENT HEAD</text>

  <path d="M115 192 L307 192" class="blue"/>
  <text x="211" y="183" text-anchor="middle" class="mono msg">/request_bot_review</text>

  <rect x="238" y="212" width="138" height="24" class="statusRun"/>
  <text x="307" y="228" text-anchor="middle" class="mono statusText" fill="#4F5C6B">status: reviewing</text>

  <path d="M307 264 L505 264" class="blue"/>
  <text x="406" y="255" text-anchor="middle" class="mono msg">review current PR HEAD</text>

  <path d="M505 304 L505 344" class="blue"/>
  <text x="521" y="328" class="mono msg">build + review</text>

  <path d="M505 372 L307 372" class="green"/>
  <text x="406" y="363" text-anchor="middle" class="mono msg">review_done + build_results[]</text>

  <rect x="238" y="392" width="138" height="24" class="statusOk"/>
  <text x="307" y="408" text-anchor="middle" class="mono statusText" fill="#425A4B">status: deploy-ready</text>

  <line x1="40" y1="446" x2="1360" y2="446" stroke="#E7E5E4"/>

  <!-- 02 REQUEST DEPLOY -->
  <text x="40" y="478" class="mono small">02 · EXPLICIT DEPLOY REQUEST</text>

  <path d="M115 514 L307 514" class="orange"/>
  <text x="211" y="505" text-anchor="middle" class="mono msg">/request_deploy</text>

  <path d="M307 552 L712 552" class="orange"/>
  <text x="510" y="543" text-anchor="middle" class="mono msg">fresh PR + full HEAD + hidden state</text>

  <path d="M712 592 L505 592" class="blue"/>
  <text x="608" y="583" text-anchor="middle" class="mono msg">list_jobs(repo, status=review_done)</text>

  <path d="M505 630 L712 630" class="green"/>
  <text x="608" y="621" text-anchor="middle" class="mono msg">latest exact PR + HEAD Review Job</text>

  <path d="M712 670 L307 670" class="green"/>
  <text x="510" y="661" text-anchor="middle" class="mono msg">write current validation snapshot</text>

  <rect x="228" y="690" width="158" height="24" class="statusWait"/>
  <text x="307" y="706" text-anchor="middle" class="mono statusText" fill="#9A6A32">status: deploy-requested</text>

  <line x1="40" y1="744" x2="1360" y2="744" stroke="#E7E5E4"/>

  <!-- 03 APPROVAL + CLEAN GATE -->
  <text x="40" y="776" class="mono small">03 · MACHINE-OWNER APPROVAL · CLEAN GATE · DEPLOY</text>

  <path d="M920 812 L307 812" class="orange"/>
  <text x="614" y="803" text-anchor="middle" class="mono msg">/approve_deploy machine=sh-g1-01</text>

  <path d="M307 850 L712 850" class="orange"/>
  <text x="510" y="841" text-anchor="middle" class="mono msg">fresh HEAD + hidden state + command actor</text>

  <path d="M712 890 L1115 890" class="blue"/>
  <text x="914" y="881" text-anchor="middle" class="mono msg">read running_image for selected components</text>

  <path d="M1115 928 L712 928" class="blue"/>
  <text x="914" y="919" text-anchor="middle" class="mono msg">running_image</text>

  <rect x="602" y="950" width="220" height="58" class="gate"/>
  <text x="712" y="972" text-anchor="middle" class="mono statusText" fill="#9A6A32">CLEAN GATE</text>
  <text x="712" y="994" text-anchor="middle" class="mono small">running_image == ""</text>

  <!-- NOT CLEAN branch -->
  <path d="M712 1050 L307 1050" class="red"/>
  <text x="510" y="1041" text-anchor="middle" class="mono msgStrong">running_image != "" -> ZERO deploy POST</text>

  <rect x="228" y="1070" width="158" height="24" class="statusWait"/>
  <text x="307" y="1086" text-anchor="middle" class="mono statusText" fill="#9A6A32">status: deploy-requested</text>

  <path d="M307 1120 L920 1120" class="blue"/>
  <text x="614" y="1111" text-anchor="middle" class="mono msg">Owner clears occupied runtime image</text>

  <path d="M920 1160 L307 1160" class="orange"/>
  <text x="614" y="1151" text-anchor="middle" class="mono msg"><![CDATA[NEW /approve_deploy machine=<alias>]]></text>

  <!-- CLEAN branch -->
  <path d="M712 1200 L307 1200" class="green"/>
  <text x="510" y="1191" text-anchor="middle" class="mono msgStrong">running_image == "" -> write GitHub first</text>

  <path d="M712 1240 L1115 1240" class="orange"/>
  <text x="914" y="1231" text-anchor="middle" class="mono msg">POST /api/drivers/{id}/deploy {image:@sha256}</text>

  <path d="M1115 1278 L712 1278" class="green"/>
  <text x="914" y="1269" text-anchor="middle" class="mono msg">deploy + exact-image health result</text>

  <path d="M712 1318 L712 1356" class="blue"/>
  <text x="728" y="1341" class="mono msg">fixed Case · advisory only</text>

  <path d="M712 1384 L307 1384" class="green"/>
  <text x="510" y="1375" text-anchor="middle" class="mono msg">command.phase=completed + deployment record</text>

  <rect x="236" y="1404" width="142" height="24" class="statusRun"/>
  <text x="307" y="1420" text-anchor="middle" class="mono statusText" fill="#4F5C6B">status: testing</text>

  <rect x="398" y="1404" width="106" height="24" class="statusFail"/>
  <text x="451" y="1420" text-anchor="middle" class="mono statusText" fill="#8F4B4B">status: failed</text>

  <line x1="40" y1="1460" x2="1360" y2="1460" stroke="#E7E5E4"/>

  <!-- 04 HUMAN TEST -->
  <text x="40" y="1492" class="mono small">04 · HUMAN FINAL TEST + COS</text>

  <path d="M920 1528 L307 1528" class="orange"/>
  <text x="614" y="1519" text-anchor="middle" class="mono msg">/record_test result=pass|fail [summary=...]</text>

  <path d="M307 1566 L712 1566" class="orange"/>
  <text x="510" y="1557" text-anchor="middle" class="mono msg">fresh HEAD + hidden state + command actor</text>

  <path d="M712 1606 L307 1606" class="green"/>
  <text x="510" y="1597" text-anchor="middle" class="mono msgStrong">terminal GitHub state first</text>

  <path d="M712 1646 L307 1646" class="green"/>
  <text x="510" y="1637" text-anchor="middle" class="mono msg">command.phase=completed + test_result + status</text>

  <path d="M712 1684 L1295 1684" class="blue"/>
  <text x="1004" y="1675" text-anchor="middle" class="mono msg">evidence.tar.gz · best effort</text>

  <path d="M1295 1722 L712 1722" class="green"/>
  <text x="1004" y="1713" text-anchor="middle" class="mono msg">object_key + sha256 + size</text>

  <path d="M712 1760 L307 1760" class="green"/>
  <text x="510" y="1751" text-anchor="middle" class="mono msg">rebind COS metadata · terminal status unchanged</text>

  <rect x="212" y="1744" width="126" height="24" class="statusOk"/>
  <text x="275" y="1760" text-anchor="middle" class="mono statusText" fill="#425A4B">status: succeeded</text>

  <rect x="350" y="1744" width="106" height="24" class="statusFail"/>
  <text x="403" y="1760" text-anchor="middle" class="mono statusText" fill="#8F4B4B">status: failed</text>

  <line x1="40" y1="1800" x2="1360" y2="1800" stroke="#E7E5E4"/>

  <!-- 05 RESTART / UNCERTAIN -->
  <text x="40" y="1832" class="mono small">05 · RESTART / UNCERTAIN RECOVERY</text>

  <path d="M307 1868 L712 1868" class="blue"/>
  <text x="510" y="1859" text-anchor="middle" class="mono msg">restart / next poll -> read hidden state</text>

  <path d="M712 1908 L307 1908" class="red"/>
  <text x="510" y="1899" text-anchor="middle" class="mono msg">executing -> uncertain · ZERO automatic replay</text>

  <path d="M712 1948 L307 1948" class="red"/>
  <text x="510" y="1939" text-anchor="middle" class="mono msg">last_processed_comment_id >= command.comment_id</text>

  <path d="M307 1988 L712 1988" class="blue"/>
  <text x="510" y="1979" text-anchor="middle" class="mono msg">fresh current full HEAD</text>

  <path d="M712 2028 L505 2028" class="blue"/>
  <text x="608" y="2019" text-anchor="middle" class="mono msg">list_jobs(repo,status=review_done)</text>

  <path d="M505 2066 L712 2066" class="green"/>
  <text x="608" y="2057" text-anchor="middle" class="mono msg">exact current-HEAD Review Job / not found</text>

  <!-- Developer next action -->
  <path d="M712 2106 L307 2106" class="red"/>
  <text x="510" y="2097" text-anchor="middle" class="mono msg">HEAD drift OR exact Review Job missing</text>

  <rect x="225" y="2126" width="164" height="24" class="statusFail"/>
  <text x="307" y="2142" text-anchor="middle" class="mono statusText" fill="#8F4B4B">status: review-required</text>

  <path d="M307 2176 L115 2176" class="blue"/>
  <text x="211" y="2167" text-anchor="middle" class="mono msg">Developer: /request_bot_review</text>

  <!-- Machine Owner next action -->
  <path d="M712 2218 L307 2218" class="green"/>
  <text x="510" y="2209" text-anchor="middle" class="mono msg">same HEAD + exact Review Job → refresh snapshot</text>

  <rect x="228" y="2238" width="158" height="24" class="statusWait"/>
  <text x="307" y="2254" text-anchor="middle" class="mono statusText" fill="#9A6A32">status: deploy-requested</text>

  <path d="M307 2288 L920 2288" class="blue"/>
  <text x="614" y="2279" text-anchor="middle" class="mono msg">Machine Owner clears occupied runtime image</text>

  <path d="M920 2328 L307 2328" class="orange"/>
  <text x="614" y="2319" text-anchor="middle" class="mono msg"><![CDATA[NEW /approve_deploy machine=<alias>]]></text>

  <path d="M307 2368 L712 2368" class="orange"/>
  <text x="510" y="2359" text-anchor="middle" class="mono msg">fresh HEAD + actor → CLEAN GATE</text>

  <text x="40" y="2404" class="mono small">no-container response -> running_image empty</text>
  <text x="40" y="2424" class="mono small">POST outcome unknown -> command.phase=uncertain</text>
  <text x="40" y="2444" class="mono small">fresh Review build_results + Registry snapshot</text>
  <text x="40" y="2464" class="mono small">POLL_ENABLED=true required; webhook supplementary</text>
</svg>
